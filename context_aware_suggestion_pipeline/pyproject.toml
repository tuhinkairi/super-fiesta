
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "context-aware-suggestion-rag"
version = "0.1.0"
description = "A modular context-aware content suggestion pipeline using Hybrid RAG, Pinecone, Gemini, and LangGraph."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Project Author" }
]

keywords = [
    "rag",
    "hybrid-search",
    "pinecone",
    "gemini",
    "langgraph",
    "content-recommendation",
    "context-aware-ai"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "google-genai>=1.0",
    "pinecone>=6.0",
    "langgraph>=0.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pytrends>=4.9.2",
    "tenacity>=9.0",
    "python-dotenv>=1.0"
]


[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "mypy>=1.14",
    "build>=1.2"
]

evaluation = [
    "ragas>=0.2"
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["context_aware_suggestion_rag*"]
namespaces = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
